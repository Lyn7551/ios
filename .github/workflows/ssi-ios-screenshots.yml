# SSI Cloud 品牌截图（fork 专用）：构建后安装到模拟器并截取首启/登录页
name: SSI iOS Screenshots

on:
  push:
    branches: [ssi-brand]
  workflow_dispatch:

env:
  PROJECT: Nextcloud.xcodeproj
  DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.0
  SCHEME: Nextcloud
  XCODE_VERSION: '27.1'
  SIMULATOR_NAME: iPhone 17

jobs:
  screenshots:
    name: Capture screenshots
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v7

    - name: Download GoogleService-Info.plist (mock)
      run: wget "https://raw.githubusercontent.com/firebase/quickstart-ios/master/mock-GoogleService-Info.plist" -O GoogleService-Info.plist

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Xcode Build
      run: |
        set -o pipefail && \
        xcodebuild build \
        -scheme "${{ env.SCHEME }}" \
        -destination "${{ env.DESTINATION }}" \
        -derivedDataPath "DerivedData" \
        | xcbeautify --quieter

    - name: Boot iOS Simulator
      run: |
        xcrun simctl boot "${{ env.SIMULATOR_NAME }}" || echo "Simulator already booted"
        xcrun simctl bootstatus "${{ env.SIMULATOR_NAME }}" || echo "Simulator booted"

    - name: Install app
      run: |
        APP=$(find DerivedData/Build/Products -name "Nextcloud.app" -path "*iphonesimulator*" -maxdepth 3 | head -1)
        echo "App bundle: $APP"
        BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
        echo "Bundle ID: $BUNDLE_ID"
        xcrun simctl install booted "$APP"
        xcrun simctl get_app_container booted "$BUNDLE_ID" app
        echo "APP=$APP" >> "$GITHUB_ENV"
        echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

    - name: Icon diagnostics
      run: |
        ASSETUTIL=$(xcrun --find assetutil)
        echo "assetutil: $ASSETUTIL"
        echo "== Assets.car AppIcon entries =="
        "$ASSETUTIL" --info "$APP/Assets.car" | grep -i -B2 -A12 "AppIcon" || echo "no AppIcon entries in Assets.car"
        echo "== .app root icon-related products =="
        find "$APP" -maxdepth 1 | grep -i -E "icon|\.car" || echo "none"
        echo "== embedded .icon bundles =="
        find "$APP" -name "*.icon" || echo "no .icon bundles"

    - name: Screenshot springboard
      run: |
        mkdir -p screenshots
        sleep 3
        xcrun simctl io booted screenshot screenshots/00-springboard.png

    - name: Capture intro pages
      run: |
        xcrun simctl launch booted "$BUNDLE_ID"
        sleep 2.8
        xcrun simctl io booted screenshot "screenshots/intro-1.png"
        sleep 1
        xcrun simctl io booted screenshot "screenshots/intro-1-backup.png"
        for i in 2 3 4 5; do
          sleep 4.2
          xcrun simctl io booted screenshot "screenshots/intro-$i.png"
        done

    - name: Capture relaunch and permission dialog
      run: |
        xcrun simctl terminate booted "$BUNDLE_ID" || true
        sleep 2
        xcrun simctl launch booted "$BUNDLE_ID"
        sleep 6
        xcrun simctl io booted screenshot screenshots/09-relaunch.png
        sleep 6
        xcrun simctl io booted screenshot screenshots/10-relaunch-2.png

    - name: Upload screenshots
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: ssi-ios-screenshots
        path: screenshots/
        retention-days: 14
